name: X — Generate Posts

on:
  schedule:
    # Monday 2:03pm UTC = 8:03am MT — a week's batch of X posts, emailed for review
    - cron: '3 14 * * 1'
  workflow_dispatch:
    inputs:
      count:
        description: 'How many posts to generate'
        default: '7'

# Serialize with x-daily so both can safely commit queue.json
concurrency:
  group: x-queue
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r social/requirements.txt

      # Real-voice grounding (tov-social skill method) reads a sampler script +
      # corpus file that live in onpath-org — a PRIVATE repo, while this repo is
      # PUBLIC, so this only runs once ONPATH_ORG_PAT (a read-only, contents-scoped
      # PAT for onpathtesting/onpath-org) is set as a secret here. Skipped
      # entirely until then; generate_x_posts.py falls back to the static
      # corpus/brian-voice.md examples when this checkout didn't happen — same
      # quiet-degrade pattern as the Gmail secret below.
      - name: Checkout onpath-org voice corpus (private, read-only, not committed)
        if: ${{ secrets.ONPATH_ORG_PAT != '' }}
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: onpathtesting/onpath-org
          token: ${{ secrets.ONPATH_ORG_PAT }}
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            marketing/docs/OnPath Assets
            marketing/lib/onpath_clients
          path: onpath-org-voice

      - name: Generate X posts, email for review, enqueue drafts
        run: python social/scripts/generate_x_posts.py --count "${{ github.event.inputs.count || '7' }}" --email
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          REVIEW_EMAIL_TO: ${{ secrets.REVIEW_EMAIL_TO }}
          ONPATH_ORG_PATH: ${{ github.workspace }}/onpath-org-voice

      - name: Commit queued drafts
        run: |
          git config user.name "brianborg-x-bot"
          git config user.email "bot@brianborg.com"
          git add social/queue.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(social): enqueue weekly drafts [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
