name: X — Daily Drip

on:
  schedule:
    # 17:00 UTC ≈ 11am Mountain — reads approvals and posts ONE approved item/day
    - cron: '0 17 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Read + plan only, post nothing (true/false)'
        default: 'false'

# Serialize with x-generate so both can safely commit queue.json
concurrency:
  group: x-queue
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  drip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r social/requirements.txt

      - name: Read approvals and post one
        run: python social/scripts/run_daily.py ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          REVIEW_EMAIL_TO: ${{ secrets.REVIEW_EMAIL_TO }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}

      - name: Commit queue state
        if: github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "brianborg-x-bot"
          git config user.email "bot@brianborg.com"
          git add social/queue.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(social): update post queue [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
